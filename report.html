<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мій звіт — Інтерактивний Python</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="practice.css"></head><body><main><nav class="brand"><a href="index.html">🐍 Інтерактивний Python</a><small>Мій навчальний маршрут</small></nav><h1>Мій звіт</h1><section class="work"><label for="report-name">Ім’я для звіту (необов’язково)</label><input id="report-name" maxlength="100" autocomplete="name"><label for="scope">Що включити</label><select id="scope"><option value="all">Увесь курс</option><optgroup label="Розділи"><option value="basics">Знайомство з Python</option><option value="conditions">Умови</option><option value="loops">Цикли</option><option value="data">Структури даних</option><option value="functions">Функції</option><option value="libraries">Бібліотеки</option></optgroup></select><label for="reflection">Що вдалося? Що ще потребує практики?</label><textarea id="reflection" rows="3" maxlength="3000"></textarea><div class="actions"><button class="button" id="print-report">Зберегти звіт як PDF / Друк</button><button class="button" id="save-json">Зберегти резервну копію</button></div><p>У вікні друку оберіть «Зберегти як PDF». Звіт доступний і до завершення практики: невиконані завдання так і позначаються.</p><p>Результати зберігаються лише в цьому браузері на цьому пристрої. Автоматично вчителю не надсилаються.</p><p role="status" id="report-status"></p></section><div id="report-area"></div><noscript>Для звіту потрібен JavaScript.</noscript></main><script src="practice-data.js"></script><script src="progress.js"></script><script src="report.js"></script></body></html>
